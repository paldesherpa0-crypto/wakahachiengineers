<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>若手エンジニア - 企業向けプラットフォーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0066cc 0%, #0080ff 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            color: white;
            text-align: center;
            margin-bottom: 3rem;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .tab-btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            background: white;
            color: #0066cc;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #0066cc;
            color: white;
        }
        .tab-content {
            display: none;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }
        input, textarea, select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #0066cc;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
            color: white;
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,102,204,0.3);
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .dashboard {
            background: white;
            padding: 2rem;
            border-radius: 12px;
        }
        .request-card {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #0066cc;
        }
        .request-card h3 {
            color: #0066cc;
            margin-bottom: 0.5rem;
        }
        .request-card p {
            color: #666;
            margin: 0.5rem 0;
        }
        .engineer-card {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #00b359;
        }
        .engineer-card h4 {
            color: #333;
            margin-bottom: 0.5rem;
        }
        .engineer-card p {
            color: #666;
            font-size: 0.9rem;
            margin: 0.3rem 0;
        }
        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn-small:hover {
            background: #004499;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-box {
            background: linear-gradient(135deg, #0066cc 0%, #0080ff 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }
        .stat-box h3 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .stat-box p {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 若手エンジニア</h1>
            <p>企業とエンジニアをつなぐマーケットプレイス</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('company-form')">企業向けリクエスト</button>
            <button class="tab-btn" onclick="switchTab('dashboard')">管理画面</button>
        </div>

        <!-- 企業向けリクエストフォーム -->
        <div id="company-form" class="tab-content active">
            <h2>人材リクエスト</h2>
            <form id="requestForm" onsubmit="submitRequest(event)">
                <div class="form-group">
                    <label>企業名 *</label>
                    <input type="text" name="companyName" required>
                </div>
                <div class="form-group">
                    <label>担当者名 *</label>
                    <input type="text" name="contactName" required>
                </div>
                <div class="form-group">
                    <label>メールアドレス *</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>電話番号</label>
                    <input type="tel" name="phone">
                </div>
                <div class="form-group">
                    <label>希望スキル *</label>
                    <input type="text" name="skills" placeholder="Python, React, Java等" required>
                </div>
                <div class="form-group">
                    <label>希望年収範囲 *</label>
                    <input type="text" name="salary" placeholder="例：400-600万円" required>
                </div>
                <div class="form-group">
                    <label>希望勤務地 *</label>
                    <select name="location" required>
                        <option value="">選択してください</option>
                        <option value="東京">東京</option>
                        <option value="神奈川">神奈川</option>
                        <option value="千葉">千葉</option>
                        <option value="埼玉">埼玉</option>
                        <option value="大阪">大阪</option>
                        <option value="福岡">福岡</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>詳細要件</label>
                    <textarea name="requirements" placeholder="その他の要件があれば記入してください"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">リクエストを送信</button>
                <div class="success-message" id="successMessage">
                    ✅ リクエストが送信されました。担当者より1営業日以内にご連絡します。
                </div>
            </form>
        </div>

        <!-- Palden 管理画面 -->
        <div id="dashboard" class="tab-content">
            <h2>Palden 管理画面</h2>
            
            <div class="stats">
                <div class="stat-box">
                    <h3 id="requestCount">0</h3>
                    <p>受付したリクエスト</p>
                </div>
                <div class="stat-box">
                    <h3 id="engineerCount">456</h3>
                    <p>登録エンジニア</p>
                </div>
                <div class="stat-box">
                    <h3 id="matchCount">0</h3>
                    <p>マッチング完了</p>
                </div>
            </div>

            <h3>企業からのリクエスト一覧</h3>
            <div id="requestsList"></div>
        </div>
    </div>

    <script>
        const requests = [];

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'dashboard') {
                loadDashboard();
            }
        }

        function submitRequest(event) {
            event.preventDefault();
            
            const formData = {
                companyName: document.querySelector('input[name="companyName"]').value,
                contactName: document.querySelector('input[name="contactName"]').value,
                email: document.querySelector('input[name="email"]').value,
                phone: document.querySelector('input[name="phone"]').value,
                skills: document.querySelector('input[name="skills"]').value,
                salary: document.querySelector('input[name="salary"]').value,
                location: document.querySelector('select[name="location"]').value,
                requirements: document.querySelector('textarea[name="requirements"]').value,
                timestamp: new Date().toISOString()
            };

            requests.push(formData);
            localStorage.setItem('requests', JSON.stringify(requests));

            document.getElementById('successMessage').classList.add('show');
            document.getElementById('requestForm').reset();

            setTimeout(() => {
                document.getElementById('successMessage').classList.remove('show');
            }, 3000);
        }

        function loadDashboard() {
            const savedRequests = JSON.parse(localStorage.getItem('requests') || '[]');
            document.getElementById('requestCount').textContent = savedRequests.length;

            const requestsList = document.getElementById('requestsList');
            requestsList.innerHTML = '';

            if (savedRequests.length === 0) {
                requestsList.innerHTML = '<p style="color: #999;">まだリクエストがありません</p>';
            } else {
                savedRequests.forEach((req, index) => {
                    const card = document.createElement('div');
                    card.className = 'request-card';
                    card.innerHTML = `
                        <h3>${req.companyName}</h3>
                        <p><strong>担当者：</strong> ${req.contactName}</p>
                        <p><strong>メール：</strong> ${req.email}</p>
                        <p><strong>希望スキル：</strong> ${req.skills}</p>
                        <p><strong>年収：</strong> ${req.salary}</p>
                        <p><strong>勤務地：</strong> ${req.location}</p>
                        <p><strong>日時：</strong> ${new Date(req.timestamp).toLocaleString('ja-JP')}</p>
                    `;
                    requestsList.appendChild(card);
                });
            }
        }

        window.addEventListener('load', () => {
            const savedRequests = JSON.parse(localStorage.getItem('requests') || '[]');
            requests.push(...savedRequests);
        });
    </script>
</body>
</html>
